<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Smart Expense Tracker</title>
     <style>
        body {
    font-family: Arial;
    background-color: #f2f5fa;
    margin: 0;
    padding: 30px;
}

.container {
    
    max-width: 550px;
    margin: 30px auto;
    display: flex;
    background-color: white;
    border-radius: 15px;
    overflow: hidden;
}
.container h1 {
    font-size: 35px;
    margin-bottom: 10px;
    text-align: center;
}
.container p {
    font-size: 16px;
    
    text-align: center;
}

.right {
    width: 100%;
    padding: 50px;
}

.right h2 {
    font-size: 30px;
    margin-top: 0;
    margin-bottom: 10px;
}

.right label {
    display: block;
    margin-top: 20px;
}

.right input {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 7px;
}

.right a {
    display: block;
    margin-top: 15px;
    color: rgb(6, 234, 234);
    text-decoration: none;
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 25px;
    background-color: rgb(6, 234, 234);
    color: white;
    border: none;
    border-radius: 7px;
    cursor: pointer;
}

button:hover {
    background-color: rgb(6, 200, 200);
} 

.password-box {
    position: relative;
}

.password-box input {
    padding-right: 40px;
}

.password-box button {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);

    width: 35px !important;
    margin: 0 !important;
    padding: 0 !important;

    background: transparent !important;
    color: #555;

    border: none;
    cursor: pointer;
}
     </style>
</head>
<body>
    <div class="background">
        <img src="image.png" alt="Background Image" style="width: 100%; height: 100%; object-fit: cover; position: fixed; top: 0; left: 0; z-index: -1;">
    </div>
    <div class="container">
        
            
            <div class="right">
                <h1>Smart Expense Tracker</h1>
            <p>Create your account to manage your expenses</p>
        
                <form id="loginForm">

                    <label>Email Address</label>
                    <input type="email"
                           id="email"
                           placeholder="Enter your email"
                           required>

                    <lebel>Password</lebel>
                    <div class="password-box">
                    <input type="password"
                           id="password"
                           placeholder="Enter your password"
                           required>
                           <button type="button"
                           onclick="showPassword()">👁</button>
                           </div>

                           <a href="#"
                              onclick="forgotPassword()">
                              Forgot Password?
                            </a>

                            <button type="submit">
                                SIGN IN
                            </button>
                </form>

                <p>
                    Don't have an account?
                    <a href="sign up.html"
                       onclick="signUp()">Sign Up</a>
                </p>
            </div>
        </div>

        <script scr="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
     <title>Smart Expense Tracker</title>
     <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <div class="logo"></div>  
                <h1>Smart Expense Tracker</h1>

                <p>
                    Track your expense, manage your budget and achive your 
                    financial goals.
                </p>
                <div class="features">
                    <p>✓Track Expense</p>
                    <p>✓Analyze Spending</p>
                    <p>✓Manage Budget</p>
                </div>
            </div>
            <div class="right">
                <h2>Welcome Back!</h2>
                <p>Login to continue to your account</p>
                <form id="loginForm">

                    <label>Email Address</label>
                    <input type="email"
                           id="email"
                           placeholder="Enter your email"
                           required>

                    <lebel>Password</lebel>
                    <div class="password-box">
                    <input type="password"
                           id="password"
                           placeholder="Enter your password"
                           required>
                           <button type="button"
                           onclick="showPassword()">👁</button>
                           </div>

                           <a href="#"
                              onclick="forgotPassword()">
                              Forgot Password?
                            </a>

                            <button type="submit">
                                SIGN IN
                            </button>
                </form>

                <p>
                    Don't have an account?
                    <a href="#"
                       onclick="signUp()">Sign Up</a>
                </p>
            </div>
        </div>

        <script scr="script.js"></script>
</body>
</html>

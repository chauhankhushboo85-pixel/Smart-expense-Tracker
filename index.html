```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <nav class="navbar">
        <div class="logo">SMART EXPENSE TRACKER</div>

        <div class="nav-links">
            <a href="#dashboard">Dashboard</a>
            <a href="#expenses">Expenses</a>
            <a href="#reports">Reports</a>
        </div>
    </nav>

    <main class="container" id="dashboard">

        <header class="welcome">
            <h1>Welcome, <span>User</span>!</h1>
            <p>Manage your money smarter, every day.</p>
        </header>

        <section class="summary">

            <div class="card income">
                <p>Total Income</p>
                <h2 id="totalIncome"></h2>
            </div>

            <div class="card expense">
                <p>Today's Expense</p>
                <h2 id="todayExpense"></h2>
            </div>

            <div class="card balance">
                <p>Remaining Balance</p>
                <h2 id="remainingBalance"></h2>
            </div>

        </section>

        <section class="chart-section" id="reports">
            <h2>Expense Analysis</h2>

            <div class="chart-box">
                <canvas id="expenseChart"></canvas>
            </div>
        </section>

        <section class="transactions" id="expenses">
            <h2>Recent Transactions</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <tbody id="transactionList"></tbody>
                </table>
            </div>
        </section>

    </main>

    <button class="add-button" id="addExpenseBtn"
        aria-label="Add expense">+</button>

    <script src="script.js"></script>

</body>
</html>
```
